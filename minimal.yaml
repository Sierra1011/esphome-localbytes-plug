substitutions:
  name: "localbytes-plug-pm"
  friendly_name: "Localbytes Plug PM"
  main_icon: "power-socket-uk"

  # Default Relay State
  # Aka: `restore_mode` in documentation
  # Options: `RESTORE_DEFAULT_OFF`, `RESTORE_DEFAULT_ON`, `ALWAYS_ON` & `ALWAYS_OFF`
  default_state: "RESTORE_DEFAULT_OFF"

  # Default state of the "disable led" virtual switch
  disable_led_default_state: "RESTORE_DEFAULT_OFF"

  # Default state of the "disable button"/child-lock virtual switch
  disable_button_default_state: "RESTORE_DEFAULT_OFF"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"

  # Pinned to 2025.7.4: newer esphome versions broke the Home Assistant API
  # connection on these devices in ways power_save_mode: NONE didn't fix.
  # Revisit once the upstream regression is identified and fixed.
  min_version: 2025.7.4
  name_add_mac_suffix: true

  project:
    name: localbytes.plug-pm
    version: "1.6.0"

esp8266:
  board: esp01_1m
  restore_from_flash: true
  early_pin_init: false

# factory_reset as a standalone component (auto-reset after repeated boot
# failures) isn't supported on the pinned esphome version -- only available
# as a button platform, which the full firmware already provides separately.

logger:

ota:
  platform: esphome

api:

# This should point to the public location of this yaml file.
dashboard_import:
  package_import_url: github://LocalBytes/esphome-localbytes-plug/localbytes-plug-pm.yaml@main

wifi:
  ap:
    ssid: "${friendly_name}"
  # min_auth_mode isn't supported on the pinned esphome version.

captive_portal:
