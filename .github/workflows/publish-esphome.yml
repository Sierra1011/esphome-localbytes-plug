name: Build and Publish ESPHome firmware

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      files:
        description: Comma-separated list of files to build.
        required: true
        type: string
      name:
        description: Name of the firmware to publish.
        required: false
        type: string
        default: ESPHome
      esphome_version:
        description: Version of ESPHome to build for.
        required: false
        type: string
        default: latest

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.files-array.outputs.files }}
    steps:
      - id: files-array
        run: |
          files=$(echo "${{ inputs.files }}" | jq -Rcn 'inputs | . / ","')
          echo "files=$files" >> $GITHUB_OUTPUT

  build:
    name: Build ESPHome binary for ${{ matrix.file }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.prepare.outputs.files) }}
    outputs:
      esphome-version: ${{ steps.esphome-build.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Write secrets file
        env:
          API_ENCRYPTION_KEY: ${{ secrets.ESPHOME_API_ENCRYPTION_KEY }}
          OTA_PASSWORD: ${{ secrets.ESPHOME_OTA_PASSWORD }}
        run: |
          cat > secrets.yaml <<SECRETS
          api_encryption_key: "${API_ENCRYPTION_KEY}"
          ota_password: "${OTA_PASSWORD}"
          SECRETS
      - name: Build binary
        uses: esphome/build-action@5f7befc3994ab0553e1de5d6fa4c3d9fece175dc # v6.0.1
        id: esphome-build
        with:
          yaml-file: ${{ matrix.file }}
          version: ${{ inputs.esphome_version }}
      - run: |
          mkdir output
          mv "${{ steps.esphome-build.outputs.name }}" output/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.file }}
          path: output

  publish:
    name: Publish firmware release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: output

      - name: Collect release assets
        run: |
          mkdir release-assets
          for dir in output/*/; do
            config=$(basename "$dir")
            base=${config%.yaml}
            find "$dir" -name '*.factory.bin' -exec cp {} "release-assets/${base}.factory.bin" \;
            find "$dir" -name '*.ota.bin' -exec cp {} "release-assets/${base}.ota.bin" \;
            find "$dir" -name 'manifest.json' -exec cp {} "release-assets/${base}-manifest.json" \;
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.build.outputs.esphome-version }}"
          tag="esphome-${version}-${GITHUB_SHA:0:7}"
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "${{ inputs.name }} (ESPHome ${version})" \
            --generate-notes \
            release-assets/*
