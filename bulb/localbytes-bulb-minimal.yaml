substitutions:
  name: "bulb"
  friendly_name: "Local Bytes RGBCT Bulb"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true

  project:
    name: sierra1011.localbytes-bulb-9w-rgbct
    version: "0.0.1"

esp8266:
  board: esp8285
  restore_from_flash: true

logger:

ota:
  platform: esphome
  password: !secret ota_password

api:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name}"

captive_portal:

# This should point to the public location of the full bulb config.
dashboard_import:
  package_import_url: github://Sierra1011/esphome-localbytes-plug/bulb/localbytes-bulb.yaml@main
